version: '3.8'

services:
  db:
    image: mysql:8.0
    container_name: smart_attendance_db
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:-rootpassword}
      MYSQL_DATABASE: ${DB_NAME:-smart_attendance}
    ports:
      - "${DB_PORT:-3306}:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./schema.sql:/docker-entrypoint-initdb.d/01_schema.sql:ro
      - ./seed.sql:/docker-entrypoint-initdb.d/02_seed.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${DB_PASSWORD:-rootpassword}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks:
      - attendance_network

  web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: smart_attendance_web
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      FLASK_ENV: production
      SECRET_KEY: ${SECRET_KEY:-change-this-in-production-long-random-key}
      DB_HOST: db
      DB_PORT: 3306
      DB_USER: root
      DB_PASSWORD: ${DB_PASSWORD:-rootpassword}
      DB_NAME: ${DB_NAME:-smart_attendance}
      ADMIN_USERNAME: ${ADMIN_USERNAME:-admin}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-Admin@12345}
      MATCH_THRESHOLD: ${MATCH_THRESHOLD:-0.40}
      MATCH_MARGIN: ${MATCH_MARGIN:-0.05}
      CONFIRM_FRAMES: ${CONFIRM_FRAMES:-2}
    ports:
      - "5000:5000"
    volumes:
      - uploads_data:/app/uploads/faces
      - ./models:/app/models:ro
    networks:
      - attendance_network

volumes:
  mysql_data:
    driver: local
  uploads_data:
    driver: local

networks:
  attendance_network:
    driver: bridge
