{% extends 'base.html' %}
{% block title %}{{ title }}{% endblock %}
{% block content %}
<div class="card" style="max-width:600px; margin:2rem auto; text-align:center; padding:2.5rem 2rem;">
  <div style="font-size:3rem; margin-bottom:0.5rem; line-height:1;">⚠️</div>
  <h1 style="margin-bottom:0.75rem;">{{ title }}</h1>
  <p class="sub" style="font-size:1.05rem; margin-bottom:1.5rem;">{{ message }}</p>
  <div class="actions" style="justify-content:center;">
    <button class="btn ghost" onclick="history.back()">Go Back</button>
    <a class="btn" href="{{ url_for('dashboard') }}">Return to Dashboard</a>
  </div>
</div>
{% endblock %}
